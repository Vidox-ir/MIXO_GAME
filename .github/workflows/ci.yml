name: MIXO GAME CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    name: TypeScript and web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ntymdsrpmsxmrvwvuiad.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H-lHD1fZ_rMt798i_RmoRQ_Lzd1b3iW

  windows-package:
    name: Windows 10/11 installer and portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
        env:
          VITE_SUPABASE_URL: https://ntymdsrpmsxmrvwvuiad.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H-lHD1fZ_rMt798i_RmoRQ_Lzd1b3iW
      - uses: actions/upload-artifact@v4
        with:
          name: MIXO-GAME-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
