name: MIXO GAME CI
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: TypeScript and web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ntymdsrpmsxmrvwvuiad.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H-lHD1fZ_rMt798i_RmoRQ_Lzd1b3iW

  windows-package:
    name: Windows 10/11 installer and portable EXE
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: https://ntymdsrpmsxmrvwvuiad.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H-lHD1fZ_rMt798i_RmoRQ_Lzd1b3iW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist:win
      - run: npm run dist:portable
      - uses: actions/upload-artifact@v4
        with:
          name: MIXO-GAME-Windows
          path: |
            release/*.exe
            release-portable/*.exe
          if-no-files-found: error
          retention-days: 14
  publish-release:
    name: Publish permanent Windows release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MIXO-GAME-Windows
          path: dist-artifacts
      - name: Publish v0.1.0 once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.1.0 already exists; keeping the published files unchanged."
            exit 0
          fi

          nsis="dist-artifacts/release/MIXO-GAME-0.1.0-x64.exe"
          portable="dist-artifacts/release-portable/MIXO-GAME-0.1.0-x64.exe"
          if [ ! -f "$nsis" ] || [ ! -f "$portable" ]; then
            echo "Installer or portable EXE is missing from the downloaded artifact."
            find dist-artifacts -maxdepth 3 -type f -print
            exit 1
          fi

          installer_asset="dist-artifacts/MIXO-GAME-Setup-0.1.0-x64.exe"
          portable_asset="dist-artifacts/MIXO-GAME-Portable-0.1.0-x64.exe"
          cp "$nsis" "$installer_asset"
          cp "$portable" "$portable_asset"
          sha256sum "$installer_asset" "$portable_asset" > dist-artifacts/SHA256SUMS.txt

          gh release create v0.1.0 "$installer_asset" "$portable_asset" dist-artifacts/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MIXO GAME v0.1.0" \
            --notes "اولین انتشار عمومی MIXO GAME. شامل نسخه نصب‌شونده ویندوز و نسخه Portable برای Windows 10/11. فایل SHA256SUMS.txt برای بررسی یکپارچگی دانلودهاست."
