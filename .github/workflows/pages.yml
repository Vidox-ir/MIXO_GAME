name: Deploy MIXO GAME to GitHub Pages
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # GitHub Pages must be enabled once in repository Settings > Pages.
          # The workflow token cannot create the Pages site for this repository.
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
        env:
          VITE_BASE_PATH: /MIXO_GAME/
          VITE_SUPABASE_URL: https://ntymdsrpmsxmrvwvuiad.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_H-lHD1fZ_rMt798i_RmoRQ_Lzd1b3iW
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
